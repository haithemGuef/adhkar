name: adhkar
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.4+11

environment:
  sdk: '>=2.19.4 <3.0.0'

dependencies:
  cupertino_icons: ^1.0.2
  get: ^4.6.6
  intl: ^0.20.2
  async: ^2.10.0
  lifecycle: ^0.10.0
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.3.10
  flutter_local_notifications: ^17.1.2
  workmanager: ^0.8.0
  photo_view: ^0.15.0

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "ffffff"
  image: "assets/images/custom.png"

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  leak_tracker_flutter_testing: 3.0.3
  leak_tracker_testing: 3.0.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/animations/
    - assets/logos/
    - assets/fonts/
    - assets/adhkar/
    - assets/audios/

  fonts:
    - family: bahij_regular
      fonts:
        - asset: assets/fonts/bahij_regular.ttf
    - family: bahij_bold
      fonts:
        - asset: assets/fonts/bahij_bold.ttf
    - family: Hacen
      fonts:
        - asset: assets/fonts/Hacen_Saudi_Arabia.ttf
    - family: Tajawal-Bold
      fonts:
        - asset: assets/fonts/Tajawal-Bold.ttf
    - family: Tajawal-Regular
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
    - family: Acme
      fonts:
        - asset: assets/fonts/Acme-Regular.ttf

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_icon.png"
